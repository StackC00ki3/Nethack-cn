name: Build NetHack-cn pre-release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nethack-prerelease-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_PATH: sys/windows/vs/NetHack.sln
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64
  PACKAGE_DIR: vspackage
  # 注意：make 命令行上的 CCFLAGS 会整体覆盖 makefile 里的赋值（GNU make
  # 命令行变量优先），而 hint 里 CCFLAGS 只有两处内容：优化级别和 Lua 头
  # 文件目录（sys/unix/hints/include/compiler.501 第 8、16 行）。所以这里
  # 必须把 Lua 的 -I 一起写上，否则 include/nhlua.h 找不到 lua.h。
  # upstream 的 CI（azure-pipelines.yml）不传 CCFLAGS，用 hint 默认的 -g。
  NH_CCFLAGS: -O2 -I../nhlua/lua/src
  #   glibc  -> dynamic build against glibc (debian:12), needs ncurses at runtime
  #   static -> static build against glibc (debian:12), no runtime deps
  LINUX_BUILD_SCRIPT: |
    set -eu

    apt-get update -qq
    DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
      build-essential groff libncurses-dev pkg-config curl ca-certificates git

    git config --global --add safe.directory /src

    cd sys/unix
    sh setup.sh "hints/linux.${NHVER}"
    cd ../..
    # Lua is vendored in nhlua/lua now; 'make fetch-lua' no longer exists.

    EXTRA_ARGS=""
    if [ "$VARIANT_LIBC" = "static" ]; then
      # 命令行 LFLAGS 同样会覆盖 hint 里的 'LFLAGS+=-rdynamic'（glibc 栈回溯用）；
      # 静态链接下 -rdynamic 本就没有意义，丢掉无妨。
      EXTRA_ARGS="$EXTRA_ARGS LFLAGS=-static"
    fi
    make GIT=1 NO_NHUUID=1 CCFLAGS="$NH_CCFLAGS" \
      WANT_WIN_TTY=1 WANT_WIN_CURSES=1 NROFF_FLAGS=-Tutf8 HACKDIR=. $EXTRA_ARGS all

    strip src/nethack util/recover

    STAGE="$PWD/stage/NetHack-cn"
    mkdir -p "$STAGE/save"
    cp src/nethack util/recover "$STAGE/"
    cp dat/nhdat dat/license dat/symbols "$STAGE/"
    cp doc/Guidebook.txt doc/nethack.txt "$STAGE/"
    chmod 755 "$STAGE/nethack" "$STAGE/recover"
    touch "$STAGE/perm" "$STAGE/record" "$STAGE/logfile" \
      "$STAGE/xlogfile" "$STAGE/livelog" "$STAGE/sysconf"
    echo "GENERICUSERS=*" > "$STAGE/sysconf"

    tar -czf "NetHack-${NHVER}-linux-$VARIANT_ARCH-$VARIANT_LIBC-$VARIANT_ORTHO.tar.gz" -C stage/NetHack-cn .

jobs:
  # 版本号的唯一来源：include/patchlevel.h
  #   VERSION_MAJOR / VERSION_MINOR / PATCHLEVEL  ->  501
  # Linux、macOS 的 hints 文件名（linux.501 / macOS.501）、产物名、发布说明全部由它推导，
  # 上游 bump 版本时这里不用改任何东西。
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.nhver.outputs.ver }}
    steps:
      - name: Checkout patchlevel.h
        uses: actions/checkout@v4
        with:
          sparse-checkout: include

      - name: Resolve NetHack version
        id: nhver
        shell: bash
        run: |
          set -eu
          # awk 而非 sed：GNU/BSD 通用，避开 macOS 上 sed 不支持 \+ 的坑
          get() { awk -v k="$1" '$1=="#define" && $2==k { print $3; exit }' include/patchlevel.h; }
          ver="$(get VERSION_MAJOR)$(get VERSION_MINOR)$(get PATCHLEVEL)"
          case "$ver" in
            [0-9][0-9][0-9]*) : ;;
            *) echo "无法从 include/patchlevel.h 解析版本号（得到 '$ver'）" >&2; exit 1 ;;
          esac
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "resolved NetHack $ver"

  build-windows:
    name: windows-x64-${{ matrix.orthography }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        orthography: [s, t, tg, twp]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up OpenCC
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo BYVoid/OpenCC --pattern "*windows*.zip" --dir ./opencc
          unzip ./opencc/*windows*.zip -d ./opencc

      - name: Set up General Standard Traditional (opencc-tonggui)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo amorphobia/opencc-tonggui --pattern "*tonggui*.zip" --dir ./opencc-tonggui
          unzip ./opencc-tonggui/*tonggui*.zip -d ./opencc-tonggui

      - name: Get All Kanji Files
        shell: bash
        run: |
          python ./.github/workflows/findkanjifiles.py

      - name: Orthographic Convert
        shell: bash
        run: |
          if [ "${{ matrix.orthography }}" = "s" ]; then
            echo "Original, skip converting"
            exit 0
          fi
          if [ "${{ matrix.orthography }}" = "tg" ]; then
            CONFIG="./opencc-tonggui/opencc/s2tg.json"
          else
            CONFIG="s2${{ matrix.orthography }}.json"
          fi
          echo "Using orthography: ${{ matrix.orthography }} ($CONFIG)"
          cat ./kanjifiles.txt
          failed=0
          # 逐个文件转换：先写临时文件再替换，避免中途失败把源文件写坏。
          # 单个文件失败不中断后面的文件，循环结束后统一报错退出。
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            echo "Converting: $file"
            if ./opencc/bin/opencc.exe -c "$CONFIG" -i "$file" -o "$file.converted" \
               && mv -f "$file.converted" "$file"; then
              :
            else
              echo "::error file=$file::opencc 转换失败（配置 $CONFIG）"
              rm -f "$file.converted"
              failed=1
            fi
          done < ./kanjifiles.txt
          if [ "$failed" -ne 0 ]; then
            echo "有文件转换失败，见上面的 error 注释。"
            exit 1
          fi

      - name: Package (Converted) Source Code
        shell: bash
        run: |
          mkdir -p "$PACKAGE_DIR"
          7z a "$PACKAGE_DIR/NetHack-cn-src-${{ matrix.orthography }}.zip" . '-xr!.git' '-xr!.github' '-xr!opencc' '-xr!opencc-tonggui' '-xr!vspackage' '-xr!kanjifiles.txt'

      - name: Build Visual Studio solution
        env:
          CL: "/utf-8"
        run: |
          msbuild $env:SOLUTION_PATH /m /p:Configuration=$env:BUILD_CONFIGURATION /p:Platform=$env:BUILD_PLATFORM /t:Build

      - name: Rename packaged artifacts
        run: |
          Get-ChildItem -Path $env:PACKAGE_DIR -Filter *.zip | Where-Object { $_.Name -notlike "NetHack-cn-src-*" } | ForEach-Object {
            $newName = "$($_.BaseName)-${{ matrix.orthography }}$($_.Extension)"
            Rename-Item -Path $_.FullName -NewName $newName
          }

      - name: Verify packaged artifacts
        run: |
          $packages = Get-ChildItem -Path $env:PACKAGE_DIR -Filter *.zip -File -ErrorAction Stop
          $packages | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nethack-vspackage-x64-${{ matrix.orthography }}
          path: vspackage/*.zip
          if-no-files-found: error

  build-linux:
    name: linux-${{ matrix.arch }}-${{ matrix.libc }}-${{ matrix.orthography }}
    needs: version
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # amd64 / i386 build natively in 32-bit-capable containers on x86_64
        # runners; arm64 uses the free public-repo arm64 runner natively.
        # All builds use debian:12 (glibc); the static variant links statically.
        orthography: [s, t, tg, twp]
        arch: [amd64, i386, arm64]
        libc: [glibc, static]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up OpenCC
        if: matrix.orthography != 's'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq opencc

      - name: Set up General Standard Traditional (opencc-tonggui)
        if: matrix.orthography == 'tg'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo amorphobia/opencc-tonggui --pattern "*tonggui*.zip" --dir ./opencc-tonggui
          unzip ./opencc-tonggui/*tonggui*.zip -d ./opencc-tonggui

      - name: Get All Kanji Files
        if: matrix.orthography != 's'
        run: python3 ./.github/workflows/findkanjifiles.py

      - name: Orthographic Convert
        if: matrix.orthography != 's'
        shell: bash
        run: |
          if [ "${{ matrix.orthography }}" = "tg" ]; then
            CONFIG="./opencc-tonggui/opencc/s2tg.json"
          else
            CONFIG="/usr/share/opencc/s2${{ matrix.orthography }}.json"
          fi
          echo "Using orthography: ${{ matrix.orthography }} ($CONFIG)"
          cat ./kanjifiles.txt
          failed=0
          # distro opencc 没有 --in-place：先写临时文件，成功后再替换。
          # 单个文件失败不中断后面的文件，循环结束后统一报错退出。
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            echo "Converting: $file"
            if opencc -c "$CONFIG" -i "$file" -o "$file.converted" \
               && mv -f "$file.converted" "$file"; then
              :
            else
              echo "::error file=$file::opencc 转换失败（配置 $CONFIG）"
              rm -f "$file.converted"
              failed=1
            fi
          done < ./kanjifiles.txt
          if [ "$failed" -ne 0 ]; then
            echo "有文件转换失败，见上面的 error 注释。"
            exit 1
          fi

      - name: Build NetHack in debian:12 container
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "${{ github.workspace }}:/src" -w /src \
            -e VARIANT_ARCH=${{ matrix.arch }} \
            -e VARIANT_LIBC=${{ matrix.libc }} \
            -e VARIANT_ORTHO=${{ matrix.orthography }} \
            -e NHVER=${{ needs.version.outputs.ver }} \
            -e NH_CCFLAGS="$NH_CCFLAGS" \
            debian:12 /bin/sh -euc "$LINUX_BUILD_SCRIPT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nethack-linux-${{ matrix.arch }}-${{ matrix.libc }}-${{ matrix.orthography }}
          path: NetHack-*-linux-*.tar.gz
          if-no-files-found: error

  build-macos:
    name: macos-arm64
    needs: version
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install groff
        run: brew install groff

      - name: Build NetHack
        run: |
          cd sys/unix
          sh setup.sh hints/macOS.${{ needs.version.outputs.ver }}
          cd ../..
          make GIT=1 CCFLAGS="$NH_CCFLAGS" USEMACPORTS=1 COLCMD=cat NROFF_FLAGS=-Tutf8 \
            WANT_WIN_TTY=1 WANT_WIN_CURSES=1 HACKDIR=. all

      - name: Stage and package
        run: |
          STAGE="$PWD/stage/NetHack-cn"
          mkdir -p "$STAGE/save"
          cp src/nethack util/recover "$STAGE/"
          cp dat/nhdat dat/license dat/symbols "$STAGE/"
          cp doc/Guidebook.txt doc/nethack.txt "$STAGE/"
          chmod 755 "$STAGE/nethack" "$STAGE/recover"
          touch "$STAGE/perm" "$STAGE/record" "$STAGE/logfile" \
            "$STAGE/xlogfile" "$STAGE/livelog" "$STAGE/sysconf"
          echo "GENERICUSERS=*" > "$STAGE/sysconf"

          ( cd stage && zip -ry "$GITHUB_WORKSPACE/NetHack-cn-macos-arm64.zip" NetHack-cn )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nethack-macos-arm64
          path: NetHack-cn-macos-arm64.zip
          if-no-files-found: error

  release:
    needs: [version, build-windows, build-linux, build-macos]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nethack-*
          path: release-assets
          merge-multiple: true

      - name: Check for any successful build
        id: have-assets
        shell: bash
        run: |
          shopt -s nullglob
          files=(release-assets/*.zip release-assets/*.tar.gz release-assets/**/*.zip release-assets/**/*.tar.gz)
          echo "Found ${#files[@]} artifact files"
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts from any build job - nothing to release"
          fi
          echo "ok=$([ ${#files[@]} -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="nethack-pre-${GITHUB_RUN_NUMBER}-${short_sha}"
          name="NetHack prerelease ${GITHUB_RUN_NUMBER} (${short_sha})"
          {
            echo "tag=$tag"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        if: steps.have-assets.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          files: |
            release-assets/*.zip
            release-assets/**/*.zip
            release-assets/*.tar.gz
            release-assets/**/*.tar.gz
          body: |
            ⚠️ 这是自动化构建的**预发布版本**，可能存在bug。

            - branch: `${{ github.ref_name }}`
            - commit: `${{ github.sha }}`

            ## 如何选择版本

            ### 1. 选择操作系统和 CPU 架构

            | 文件名片段 | 说明 |
            |---|---|
            | `win-x64` / `.zip` | Windows，64 位|
            | `linux-amd64` | Linux，64 位 |
            | `linux-i386` | Linux，32 位|
            | `linux-arm64` | Linux，ARM 64 位|
            | `macos-arm64` | macOS，Apple Silicon 芯片 |
            | `NetHack-cn-src-*` | 源代码包|

            ### 2. Linux 用户：选择 glibc 还是 static

            | 变体 | 说明 |
            |---|---|
            | `glibc` | 体积更小，但运行时系统需要已安装 ncurses 库（多数发行版自带） |
            | `static` | 解压即玩。如果在 glibc 版本上遇到库缺失或版本不兼容问题，请选这个 |

            ### 3. 选择汉字规范（文件名结尾的 `-s` / `-t` / `-tg` / `-twp`）

            | 后缀 | 规范 |
            |---|---|
            | `-s` | 简体（原文） |
            | `-t` | OpenCC 標準繁體 | 
            | `-tg` | 通用規範漢字表繁體 |
            | `-twp` | 台灣正體 |

            > macOS 版本目前仅有简体（`-s`）。

            ### 文件名速查

            ```
            NetHack-${{ needs.version.outputs.ver }}-linux-{架构}-{glibc|static}-{汉字规范}.tar.gz   # Linux
            nethack-${{ needs.version.outputs.ver }}-win-x64-{汉字规范}.zip                        # Windows
            nethack-${{ needs.version.outputs.ver }}-win-x64-debugsymbols-{汉字规范}.zip           # Windows 调试符号（普通用户无需下载）
            NetHack-cn-macos-arm64.zip                                # macOS (Apple Silicon, 简体)
            NetHack-cn-src-{汉字规范}.zip                              # 源代码
            ```
            
